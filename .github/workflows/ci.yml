name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - run: make e2e
      - run: make build-mac
      - uses: actions/upload-artifact@v4
        with:
          name: hat-darwin-arm64
          path: dist/hat-darwin-arm64
